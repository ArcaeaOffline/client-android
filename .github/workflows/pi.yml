name: pi

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  pi:
    if: |
      (
        contains(
          fromJson('["OWNER", "MEMBER", "COLLABORATOR"]'),
          github.event.comment.author_association
        )
      ) && (
        startsWith(github.event.comment.body, '/pi ')
      ) && (
        github.event.pull_request.head.repo.fork != true
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Release local.properties file
        run: cp local.defaults.properties local.properties

      - name: Resolve provider and model
        id: resolve-model
        env:
          PI_MODEL: ${{ vars.PI_MODEL || 'deepseek/deepseek-flash' }}
        run: |
          if [[ "$PI_MODEL" != */* ]]; then
            echo "::error title=Invalid PI_MODEL::Expected 'provider/model', got '$PI_MODEL'"
            exit 1
          fi
          {
            echo "provider=${PI_MODEL%%/*}"
            echo "model=${PI_MODEL#*/}"
          } >> "$GITHUB_OUTPUT"

      - name: Run pi agent
        id: pi
        uses: shaftoe/pi-coding-agent-action@d14d9e06ad38861cd3964c8a985dee871f7ff994
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          provider: ${{ steps.resolve-model.outputs.provider }}
          model: ${{ steps.resolve-model.outputs.model }}
          token: ${{ secrets.ACTIONS_AGENT_API_KEY }}
          export_session_html: true
          export_session_jsonl: true

      - name: Upload session
        if: ${{ steps.pi.outputs.session_jsonl_path || steps.pi.outputs.session_html_path }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: session-files
          path: |
            ${{ steps.pi.outputs.session_jsonl_path }}
            ${{ steps.pi.outputs.session_html_path }}
